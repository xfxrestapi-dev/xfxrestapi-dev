<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ANYAAPI • Dashboard</title>

  <style>
    :root {
      --bg: #080808;
      --card: #111111;
      --card2: #0d0d0d;
      --border: #252525;
      --text: #ffffff;
      --muted: #777777;
      --pink: #ff4b7d;
      --green: #5ee890;
      --red: #ff6464;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 560px;
      margin: auto;
      padding: 22px 15px 35px;
    }

    /* HEADER */

    .header {
      padding: 8px 2px 22px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span {
      color: var(--pink);
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    /* CARD */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 19px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    /* ACCOUNT */

    .account {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #1b1b1b;
      border: 1px solid #2c2c2c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--pink);
      flex-shrink: 0;
    }

    .account-info {
      min-width: 0;
      flex: 1;
    }

    .account-email {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-status {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--green);
      font-size: 11px;
      margin-top: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: var(--card2);
      border: 1px solid #202020;
      border-radius: 11px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
    }

    .stat-label {
      color: #666;
      font-size: 9px;
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* API KEY */

    .key-wrapper {
      display: flex;
      gap: 8px;
    }

    .key-input {
      width: 100%;
      min-width: 0;
      background: #080808;
      border: 1px solid #292929;
      border-radius: 10px;
      color: #fff;
      padding: 13px;
      outline: none;
      font-size: 12px;
    }

    .key-input:focus {
      border-color: var(--pink);
    }

    .copy-button {
      width: auto;
      padding: 0 15px;
      border-radius: 10px;
      border: 1px solid #292929;
      background: #1a1a1a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .generate-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      background: var(--pink);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    button:hover {
      opacity: .86;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* API INFO */

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 11px 0;
      border-bottom: 1px solid #202020;
      font-size: 12px;
    }

    .info-row:first-child {
      padding-top: 0;
    }

    .info-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .info-label {
      color: #707070;
    }

    .info-value {
      text-align: right;
      word-break: break-all;
    }

    .active {
      color: var(--green);
    }

    /* MESSAGE */

    .message {
      display: none;
      margin-top: 11px;
      padding: 11px 12px;
      background: #181818;
      border: 1px solid #252525;
      border-radius: 9px;
      font-size: 11px;
      line-height: 1.5;
    }

    .message.success {
      color: var(--green);
    }

    .message.error {
      color: var(--red);
    }

    /* LOGOUT */

    .logout {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: #151515;
      border: 1px solid #292929;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    /* LOADING */

    .loading {
      color: #666;
      font-size: 12px;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      color: #444;
      font-size: 10px;
      margin-top: 22px;
    }

    /* MOBILE */

    @media (max-width: 400px) {

      .key-wrapper {
        flex-direction: column;
      }

      .copy-button {
        width: 100%;
        padding: 11px;
      }

      .stats {
        gap: 6px;
      }

    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">
        ANYA<span>API</span>
      </div>

      <div class="subtitle">
        API Management Dashboard
      </div>

    </header>


    <!-- ACCOUNT -->

    <section class="card">

      <div class="card-title">
        Account
      </div>

      <div class="account">

        <div
          class="avatar"
          id="avatar"
        >
          A
        </div>

        <div class="account-info">

          <div
            class="account-email"
            id="email"
          >
            <span class="loading">
              Loading...
            </span>
          </div>

          <div class="account-status">

            <span class="dot"></span>

            Session Active

          </div>

        </div>

      </div>

    </section>


    <!-- STATISTICS -->

    <section class="card">

      <div class="card-title">
        Overview
      </div>

      <div class="stats">

        <div class="stat">

          <div
            class="stat-value active"
            id="sessionStatus"
          >
            Active
          </div>

          <div class="stat-label">
            Session
          </div>

        </div>

        <div class="stat">

          <div
            class="stat-value"
            id="keyStatus"
          >
            None
          </div>

          <div class="stat-label">
            API Key
          </div>

        </div>

        <div class="stat">

          <div
            class="stat-value"
          >
            API
          </div>

          <div class="stat-label">
            Type
          </div>

        </div>

      </div>

    </section>


    <!-- API KEY -->

    <section class="card">

      <div class="card-title">
        API Key
      </div>

      <div class="key-wrapper">

        <input
          id="apiKey"
          class="key-input"
          type="text"
          readonly
          placeholder="Generate API Key..."
        >

        <button
          id="copyButton"
          class="copy-button"
          onclick="copyApiKey()"
        >
          Copy
        </button>

      </div>

      <button
        id="generateButton"
        class="generate-button"
        onclick="generateApiKey()"
      >
        Generate API Key
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </section>


    <!-- INFORMATION -->

    <section class="card">

      <div class="card-title">
        Information
      </div>

      <div class="info-row">

        <div class="info-label">
          Account
        </div>

        <div
          class="info-value"
          id="infoEmail"
        >
          -
        </div>

      </div>

      <div class="info-row">

        <div class="info-label">
          Account ID
        </div>

        <div
          class="info-value"
          id="userId"
        >
          -
        </div>

      </div>

      <div class="info-row">

        <div class="info-label">
          API Status
        </div>

        <div class="info-value active">
          Online
        </div>

      </div>

      <div class="info-row">

        <div class="info-label">
          Session
        </div>

        <div class="info-value active">
          Protected
        </div>

      </div>

    </section>


    <!-- LOGOUT -->

    <button
      id="logoutButton"
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>


    <footer class="footer">
      ANYAAPI • API Management System
    </footer>

  </main>


<script>

/*
|--------------------------------------------------------------------------
| LOAD USER
|--------------------------------------------------------------------------
*/

async function loadUser() {

  try {

    const response =
      await fetch(
        "/api/auth/me",
        {
          method: "GET",
          credentials: "include"
        }
      );

    if (!response.ok) {

      window.location.href =
        "/login";

      return;

    }

    const data =
      await response.json();

    if (!data.ok || !data.user) {

      window.location.href =
        "/login";

      return;

    }

    const user =
      data.user;

    document.getElementById(
      "email"
    ).textContent =
      user.email;

    document.getElementById(
      "infoEmail"
    ).textContent =
      user.email;

    document.getElementById(
      "userId"
    ).textContent =
      user.id;

    /*
      Ambil huruf pertama email
      untuk avatar.
    */

    document.getElementById(
      "avatar"
    ).textContent =
      user.email
        .charAt(0)
        .toUpperCase();

  } catch (error) {

    console.error(error);

    window.location.href =
      "/login";

  }

}


/*
|--------------------------------------------------------------------------
| GENERATE API KEY
|--------------------------------------------------------------------------
*/

async function generateApiKey() {

  const button =
    document.getElementById(
      "generateButton"
    );

  const input =
    document.getElementById(
      "apiKey"
    );

  button.disabled = true;

  button.textContent =
    "Generating...";

  hideMessage();

  try {

    const response =
      await fetch(
        "/api/key/generate",
        {
          method: "GET",
          credentials: "include",
          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    const data =
      await response.json();

    /*
      Session expired.
    */

    if (response.status === 401) {

      window.location.href =
        "/login";

      return;

    }

    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.message ||
        "Gagal membuat API key"
      );

    }

    /*
      Otomatis masukkan key
      ke input.
    */

    input.value =
      data.apiKey;

    document.getElementById(
      "keyStatus"
    ).textContent =
      "Active";

    document.getElementById(
      "keyStatus"
    ).classList.add(
      "active"
    );

    showMessage(
      "API Key berhasil dibuat dan otomatis ditempel.",
      "success"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "Terjadi kesalahan.",
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "Generate API Key";

  }

}


/*
|--------------------------------------------------------------------------
| COPY API KEY
|--------------------------------------------------------------------------
*/

async function copyApiKey() {

  const input =
    document.getElementById(
      "apiKey"
    );

  if (!input.value) {

    showMessage(
      "Generate API key terlebih dahulu.",
      "error"
    );

    return;

  }

  try {

    await navigator.clipboard.writeText(
      input.value
    );

    showMessage(
      "API Key berhasil disalin.",
      "success"
    );

  } catch (error) {

    input.focus();
    input.select();

    document.execCommand(
      "copy"
    );

    showMessage(
      "API Key berhasil disalin.",
      "success"
    );

  }

}


/*
|--------------------------------------------------------------------------
| LOGOUT
|--------------------------------------------------------------------------
*/

async function logout() {

  const button =
    document.getElementById(
      "logoutButton"
    );

  button.disabled = true;

  button.textContent =
    "Logging out...";

  try {

    await fetch(
      "/api/auth/logout",
      {
        method: "POST",
        credentials: "include"
      }
    );

  } catch (error) {

    console.error(error);

  } finally {

    window.location.href =
      "/login";

  }

}


/*
|--------------------------------------------------------------------------
| MESSAGE
|--------------------------------------------------------------------------
*/

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );

  message.style.display =
    "block";

  message.textContent =
    text;

  message.className =
    "message " + type;

}


function hideMessage() {

  const message =
    document.getElementById(
      "message"
    );

  message.style.display =
    "none";

}


/*
|--------------------------------------------------------------------------
| START
|--------------------------------------------------------------------------
*/

loadUser();

</script>

</body>
</html>
